name: build

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tidy Go modules
        run: go mod tidy
      - name: Check for changes
        run: git diff --exit-code
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    steps:
      - name: Run tests in a FreeBSD VM
        uses: acj/freebsd-firecracker-action@v0.12.0
        with:
          disk-size: 8G
          run-in-vm: |
            uname -a
            pkg install -y go git bash
            cd firecracker-freebsd
            go build ./...
            go test ./...

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: dist
          path: dist

  test_postgres:
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ^1
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Test
        run: go test ./...
        env:
          ICY_DB_DRIVER: postgres
          ICY_DB_DATA_SOURCE: postgres://postgres:postgres@localhost/postgres?sslmode=disable
