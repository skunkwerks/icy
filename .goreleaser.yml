# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: icy

before:
  hooks:
    - go mod tidy
    - rm -rf completions manpages
    - mkdir completions manpages
    - sh -c 'go run ./cmd/icy completion bash >./completions/icy.bash'
    - sh -c 'go run ./cmd/icy completion zsh >./completions/icy.zsh'
    - sh -c 'go run ./cmd/icy completion fish >./completions/icy.fish'
    - sh -c 'go run ./cmd/icy man | gzip -c >./manpages/icy.1.gz'

builds:
  - id: icy
    main: ./cmd/icy
    binary: icy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.Version=v{{ .Version }}
      - -X main.CommitSHA={{ .Commit }}
      - -X main.CommitDate={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*

nfpms:
  - package_name: icy
    vendor: skunkwerks
    homepage: https://github.com/skunkwerks/icy
    maintainer: Dave Cottlehuber <dch@skunkwerks.at>
    description: A tasty, self-hostable Git server for the command line
    license: MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - apk
      - deb
      - rpm
    dependencies:
      - git
      - bash
    contents:
      - src: ./completions/icy.bash
        dst: /etc/bash_completion.d/icy
      - src: ./completions/icy.fish
        dst: /usr/share/fish/vendor_completions.d/icy.fish
      - src: ./completions/icy.zsh
        dst: /usr/share/zsh/site-functions/_icy
      - src: ./manpages/icy.1.gz
        dst: /usr/share/man/man1/icy.1.gz
      - src: ./.nfpm/icy.service
        dst: /usr/lib/systemd/system/icy.service
      - src: ./.nfpm/icy.conf
        dst: /etc/icy.conf
        type: config|noreplace
      - src: ./.nfpm/sysusers.conf
        dst: /usr/lib/sysusers.d/icy.conf
      - src: ./.nfpm/tmpfiles.conf
        dst: /usr/lib/tmpfiles.d/icy.conf
    scripts:
      postinstall: ./.nfpm/postinstall.sh
      postremove: ./.nfpm/postremove.sh

dockers_v2:
  - id: icy
    ids: [icy]
    images:
      - ghcr.io/skunkwerks/icy
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: A tasty, self-hostable Git server for the command line
      org.opencontainers.image.source: https://github.com/skunkwerks/icy
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

checksum:
  name_template: checksums.txt

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: skunkwerks
    name: icy
  prerelease: auto
